<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cancer Clicker NG is an incremental game about one relentlessly optimizing cell."
    />
    <title>Cancer Clicker NG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app" class="application-shell" aria-labelledby="game-title">
      <header class="masthead">
        <p class="eyebrow">Clinical growth simulation</p>
        <h1 id="game-title">Cancer Clicker NG</h1>
        <p class="subtitle">One transformed cell. No exit interview.</p>
      </header>
      <section class="probe-panel" aria-labelledby="probe-title">
        <h2 id="probe-title">Contract probe online</h2>
        <p>
          The first vertical slice connects typed events to a minimal interface. The cell is
          preparing its paperwork.
        </p>
        <div class="action-row">
          <button id="divide-button" type="button">Divide once</button>
          <button id="format-button" class="secondary-action" type="button">Toggle format</button>
        </div>
        <p id="game-status" class="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
